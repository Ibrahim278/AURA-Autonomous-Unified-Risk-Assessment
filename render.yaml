# Render blueprint: New > Blueprint > pick this repo. Free plan; sleeps after 15 min idle.
services:
  - type: web
    name: aura-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # paste a key in the Render dashboard to turn on AI; without it AURA uses offline answers
